name: Publish landing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gramscii-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package static landing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic tests
        run: bash .github/ci/local-test.sh
      - name: Verify browser layout
        run: node .github/ci/browser-layout-audit.mjs
      - name: Package only public website files
        run: |
          mkdir -p _site/src
          cp index.html styles.css brand-dark.css favicon.svg _site/
          cp src/app.js src/content.js _site/src/
          touch _site/.nojekyll
          test -f _site/index.html
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
