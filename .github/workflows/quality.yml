name: Landing quality

on:
  push:
    branches: [main, feat/trust-first-landing]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run zero-dependency checks
        run: bash .github/ci/local-test.sh

  visual-layout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Chromium is available
        run: |
          google-chrome --version || chromium --version
      - name: Audit real browser layout (320, 390, 640, 768, 1440px)
        run: node .github/ci/browser-layout-audit.mjs
      - name: Capture desktop and mobile visual review snapshots
        run: node .github/ci/visual-snapshots.mjs
      - name: Upload browser snapshots for design review
        uses: actions/upload-artifact@v4
        with:
          name: gramscii-visual-review
          path: .visual-snapshots/*.png
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Package self-contained local preview (no deploy)
        run: |
          set -euo pipefail
          mkdir -p local-preview/src
          cp index.html styles.css brand-dark.css motion.css storytelling.css favicon.svg local-preview/
          cp src/app.js src/content.js src/motion.js src/storytelling.js local-preview/src/
          test -s local-preview/index.html
      - name: Upload local preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: gramscii-local-preview
          path: local-preview/
          retention-days: 7
          if-no-files-found: error
